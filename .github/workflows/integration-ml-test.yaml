name: Integration ML Test

# Runs one neuracore ML integration test. Intended to be called from the
# neuracore repo's integration-ml-* workflows.
#
# environment: staging    — checks out the caller's ref, builds and installs
#   neuracore from source with the bundled Rust data daemon (NCD_RUST_DAEMON=1).
# environment: production — resolves the latest v* release tag, checks out the
#   test harness at that tag and installs the released wheel from PyPI (which
#   exercises the default Python daemon).

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to test against: staging or production"
        required: true
        type: string
      test-path:
        description: "Pytest target, e.g. tests/integration/ml/test_training_flow.py (may include a ::testcase selector)"
        required: true
        type: string
      extras:
        description: "Comma-separated pip extras to install neuracore with"
        required: false
        type: string
        default: "dev,ml,examples"
      lfs:
        description: "Pull Git LFS objects after checkout"
        required: false
        type: boolean
        default: true
    secrets:
      STAGING_SERVICE_API_KEY:
        required: false
      PROD_SERVICE_API_KEY:
        required: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Show disk space
        run: df -h /

      # Headless rendering deps for the ML test suites (Xvfb + OpenGL) and
      # xmllint for URDF validation. FFmpeg comes with the neuracore install
      # below (daemon action on staging, explicit install on production).
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ inputs.environment == 'production' && 'ffmpeg' || '' }} libxml2-utils xvfb libgl1-mesa-dev libgl1 libosmesa6-dev

      - name: Checkout test harness
        if: inputs.environment == 'staging'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Checkout repository metadata
        if: inputs.environment == 'production'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest release tag
        if: inputs.environment == 'production'
        id: release-tag
        run: |
          latest_release_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest_release_tag" ]; then
            echo "::error::No release tag matching v* found"
            exit 1
          fi
          echo "latest_release_tag=$latest_release_tag" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: $latest_release_tag"

      - name: Checkout test harness at release tag
        if: inputs.environment == 'production'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-tag.outputs.latest_release_tag }}
          fetch-depth: 0

      - name: Verify production test harness ref
        if: inputs.environment == 'production'
        run: |
          checked_out_ref="$(git describe --tags --exact-match HEAD)"
          expected_ref="${{ steps.release-tag.outputs.latest_release_tag }}"
          if [ "$checked_out_ref" != "$expected_ref" ]; then
            echo "::error::Expected production test harness ref $expected_ref, got $checked_out_ref"
            exit 1
          fi

      - name: Pull LFS objects
        if: inputs.lfs
        run: git lfs pull

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up neuracore with Rust data daemon
        if: inputs.environment == 'staging'
        uses: NeuracoreAI/shared-workflows/actions/setup-neuracore-daemon-from-source@main
        with:
          checkout: "false"
          path: "."
          extras: ${{ inputs.extras }}

      - name: Install neuracore from PyPI
        if: inputs.environment == 'production'
        env:
          VERSION: ${{ steps.release-tag.outputs.latest_release_tag }}
          EXTRAS: ${{ inputs.extras }}
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir "neuracore[$EXTRAS]==${VERSION#v}"

      - name: Resolve test harness
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TEST_PATH: ${{ inputs.test-path }}
          HARNESS_REF: ${{ inputs.environment == 'production' && steps.release-tag.outputs.latest_release_tag || github.ref_name }}
        run: |
          echo "Test harness environment: $ENVIRONMENT"
          echo "Test harness ref: $HARNESS_REF"
          echo "Test harness commit: $(git rev-parse HEAD)"
          echo "Test harness path: $TEST_PATH"
          python - << 'EOF'
          import neuracore

          print(f"Installed neuracore version: {neuracore.__version__}")
          EOF

      - name: Run Integration Test
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          NEURACORE_API_URL: ${{ inputs.environment == 'production' && 'https://api.neuracore.com/api' || 'https://staging.api.neuracore.com/api' }}
          NEURACORE_API_KEY: ${{ inputs.environment == 'production' && secrets.PROD_SERVICE_API_KEY || secrets.STAGING_SERVICE_API_KEY }}
          NEURACORE_ORG_ID: ${{ inputs.environment == 'production' && vars.PROD_SERVICE_ORG_ID || vars.STAGING_SERVICE_ORG_ID }}
          NEURACORE_ENDPOINT_TIMEOUT: 30
          DISPLAY: :0
          TEST_PATH: ${{ inputs.test-path }}
        run: |
          # Staging exercises the bundled Rust daemon; production keeps the
          # released wheel's default (Python daemon).
          if [ "$ENVIRONMENT" = "staging" ]; then
            export NCD_RUST_DAEMON=1
          fi
          Xvfb $DISPLAY -screen 0 1280x1024x24 &
          pytest \
            -o log_cli=true \
            --log-cli-level=INFO \
            --log-cli-format="%(asctime)s %(levelname)-8s [%(name)s] %(message)s" \
            --log-cli-date-format="%H:%M:%S" \
            -v \
            "$TEST_PATH"

      - name: Show disk space after tests
        if: always()
        run: df -h /
