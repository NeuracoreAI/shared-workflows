name: "Set up Neuracore (from source)"
description: >
  Checks out the neuracore source, builds the Rust data-daemon
  binary with rust/scripts/build_wheel_artefacts.sh and installs the neuracore
  Python package from the checkout so maturin bundles the binary into the
  wheel, then verifies the installed package and daemon bundle. Used by
  staging-style integration tests.
  Python must already be set up by the caller (actions/setup-python).

inputs:
  checkout:
    description: "Check out the neuracore source (default branch of NeuracoreAI/neuracore). Set to 'false' when running inside the neuracore repo itself (with path: '.')"
    required: false
    default: "true"
  path:
    description: "Path to the neuracore source tree, relative to the workspace"
    required: false
    default: "neuracore"
  extras:
    description: "Comma-separated pip extras, e.g. 'dev,ml,examples'"
    required: false
    default: ""
  pytorch-cpu:
    description: "Add the PyTorch CPU wheel index (used with the 'import' extra on CI runners)"
    required: false
    default: "false"
  neuracore-types-ref:
    description: "Git ref of neuracore_types to install over the PyPI copy. Set to '' to keep the published version."
    required: false
    default: "main"

runs:
  using: "composite"
  steps:
    - name: Checkout neuracore source
      if: inputs.checkout == 'true'
      uses: actions/checkout@v4
      with:
        repository: "NeuracoreAI/neuracore"
        path: ${{ inputs.path }}
        sparse-checkout: |
          neuracore
          rust

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.path }}/rust
        # One cache shared by every workflow in the calling repo (default key
        # includes the job ID, which splits it per-workflow), saved even when
        # the test job fails so flaky suites still warm the cache.
        shared-key: neuracore-daemon
        cache-on-failure: "true"

    # The daemon shells out to the system ffmpeg for video encoding and
    # hard-fails at startup without it. Both version strings pin the same
    # ffmpeg 9.0 release; the Linux (BtbN) and macOS arm64 (OSXExperts)
    # build sources tag it differently.
    - name: Install FFmpeg
      uses: AnimMouse/setup-ffmpeg@v1.2.5
      with:
        version: ${{ runner.os == 'macOS' && '9' || '9.0' }}

    - name: Verify FFmpeg build
      shell: bash
      run: ffmpeg -version | grep -q enable-libx264

    # Build the standalone daemon binary before `pip install .` so the
    # [tool.maturin] include bundles it into the built wheel; without it the
    # SDK has no daemon to launch.
    - name: Build data-daemon binary
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install llvm
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
        fi
        bash rust/scripts/build_wheel_artefacts.sh

    - name: Install neuracore from source
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        EXTRAS: ${{ inputs.extras }}
        PYTORCH_CPU: ${{ inputs.pytorch-cpu }}
      run: |
        python -m pip install --no-cache-dir --upgrade pip
        spec="."
        if [ -n "$EXTRAS" ]; then
          spec=".[$EXTRAS]"
        fi
        if [ "$PYTORCH_CPU" = "true" ]; then
          pip install --no-cache-dir "$spec" --extra-index-url https://download.pytorch.org/whl/cpu
        else
          pip install --no-cache-dir "$spec"
        fi

    # Staging tests run against unreleased neuracore_types.
    - name: Install neuracore_types from git ref
      if: inputs.neuracore-types-ref != ''
      shell: bash
      env:
        NEURACORE_TYPES_REF: ${{ inputs.neuracore-types-ref }}
      run: |
        pip install --no-cache-dir --force-reinstall --no-deps \
          "neuracore_types @ git+https://github.com/NeuracoreAI/neuracore_types.git@${NEURACORE_TYPES_REF}"

    # cd away from the checkout so `import neuracore` resolves to the
    # installed wheel, not the source tree the binary was staged into.
    - name: Verify installed neuracore
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        python - << 'PYEOF'
        import os

        import neuracore
        from neuracore.data_daemon.binary import data_daemon_binary_path

        print(f"Installed neuracore version: {neuracore.__version__}")

        # Fail fast if the daemon bundle didn't install -- otherwise every
        # daemon-backed call fails later with a less obvious error.
        binary = data_daemon_binary_path()
        assert binary is not None, (
            "bundled data-daemon binary not found; the neuracore "
            "install did not bundle it"
        )
        assert os.access(binary, os.X_OK), f"daemon binary not executable: {binary}"
        print(f"Bundled data-daemon binary: {binary}")
        PYEOF
