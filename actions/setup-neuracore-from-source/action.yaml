name: "Set up Neuracore (from source)"
description: >
  Checks out the neuracore source, builds the Rust data-daemon
  binary with rust/scripts/build_wheel_artefacts.sh and installs the neuracore
  Python package from the checkout as an editable install, so the checkout is
  the importable package and carries both native artefacts, then verifies the
  installed package and daemon bundle. Used by staging-style integration
  tests.
  Python must already be set up by the caller (actions/setup-python).

inputs:
  checkout:
    description: "Check out the neuracore source (default branch of NeuracoreAI/neuracore). Set to 'false' when running inside the neuracore repo itself (with path: '.')"
    required: false
    default: "true"
  ref:
    description: "Branch, tag or SHA of NeuracoreAI/neuracore to check out. Empty checks out the default branch. Ignored when checkout is 'false'."
    required: false
    default: ""
  path:
    description: "Path to the neuracore source tree, relative to the workspace"
    required: false
    default: "neuracore"
  extras:
    description: "Comma-separated pip extras, e.g. 'dev,ml,examples'"
    required: false
    default: ""
  pytorch-cpu:
    description: "Add the PyTorch CPU wheel index (used with the 'import' extra on CI runners)"
    required: false
    default: "false"
  neuracore-types-ref:
    description: "Git ref of neuracore_types to install over the PyPI copy. Set to '' to keep the published version."
    required: false
    default: "main"

outputs:
  neuracore-version:
    description: "Installed neuracore version"
    value: ${{ steps.verify.outputs.neuracore-version }}
  neuracore-types-version:
    description: "Installed neuracore_types version, or empty when not installed"
    value: ${{ steps.verify.outputs.neuracore-types-version }}
  neuracore-types-sha:
    description: "Commit neuracore-types-ref resolved to, or empty when types came from PyPI"
    value: ${{ steps.types.outputs.neuracore-types-sha }}

runs:
  using: "composite"
  steps:
    - name: Checkout neuracore source
      if: inputs.checkout == 'true'
      uses: actions/checkout@v4
      with:
        repository: "NeuracoreAI/neuracore"
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}
        sparse-checkout: |
          neuracore
          rust

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.path }}/rust
        # One cache shared by every workflow in the calling repo (default key
        # includes the job ID, which splits it per-workflow), saved even when
        # the test job fails so flaky suites still warm the cache.
        shared-key: neuracore-daemon
        cache-on-failure: "true"

    # The daemon shells out to the system ffmpeg for video encoding and
    # hard-fails at startup without it. Both version strings pin the same
    # ffmpeg 9.0 release; the Linux (BtbN) and macOS arm64 (OSXExperts)
    # build sources tag it differently.
    - name: Install FFmpeg
      uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
      with:
        version: ${{ runner.os == 'macOS' && '9' || '9.0' }}

    - name: Verify FFmpeg build
      shell: bash
      run: ffmpeg -version | grep -q enable-libx264

    # Build the standalone daemon binary before the install so it is staged at
    # neuracore/data_daemon/bin/data-daemon, where the SDK looks for it; without
    # it the SDK has no daemon to launch.
    - name: Build data-daemon binary
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install llvm
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
        fi
        bash rust/scripts/build_wheel_artefacts.sh

    - name: Install neuracore from source
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        EXTRAS: ${{ inputs.extras }}
        PYTORCH_CPU: ${{ inputs.pytorch-cpu }}
      run: |
        python -m pip install --no-cache-dir --upgrade pip
        spec="."
        if [ -n "$EXTRAS" ]; then
          spec=".[$EXTRAS]"
        fi
        if [ "$PYTORCH_CPU" = "true" ]; then
          pip install --no-cache-dir -e "$spec" --extra-index-url https://download.pytorch.org/whl/cpu
        else
          pip install --no-cache-dir -e "$spec"
        fi

    # Staging tests run against unreleased neuracore_types. A branch ref moves,
    # so record the commit it pointed at for whoever reads the results later.
    - name: Install neuracore_types from git ref
      id: types
      if: inputs.neuracore-types-ref != ''
      shell: bash
      env:
        NEURACORE_TYPES_REF: ${{ inputs.neuracore-types-ref }}
      run: |
        repo="https://github.com/NeuracoreAI/neuracore_types.git"
        pip install --no-cache-dir --force-reinstall --no-deps \
          "neuracore_types @ git+${repo}@${NEURACORE_TYPES_REF}"

        # Empty when the ref is already a SHA, which ls-remote does not resolve.
        sha="$(git ls-remote "$repo" "$NEURACORE_TYPES_REF" | cut -f1 | head -n 1)"
        echo "neuracore-types-sha=${sha:-$NEURACORE_TYPES_REF}" >> "$GITHUB_OUTPUT"

    # cd away from the checkout so `import neuracore` resolves through the
    # install rather than the working directory.
    - name: Verify installed neuracore
      id: verify
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        python - << 'PYEOF'
        import importlib.metadata as md
        import os

        import neuracore
        from neuracore.data_daemon.binary import data_daemon_binary_path

        versions = {"neuracore-version": neuracore.__version__}
        try:
            versions["neuracore-types-version"] = md.version("neuracore_types")
        except md.PackageNotFoundError:
            pass

        for name, version in versions.items():
            print(f"Installed {name.removesuffix('-version')} version: {version}")

        # Published so callers can record what was tested (see the
        # publish-ci-manifest action) without re-deriving it.
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            for name, version in versions.items():
                output.write(f"{name}={version}\n")

        # Fail fast if the daemon bundle didn't install -- otherwise every
        # daemon-backed call fails later with a less obvious error.
        binary = data_daemon_binary_path()
        assert binary is not None, (
            "bundled data-daemon binary not found; the neuracore "
            "install did not bundle it"
        )
        assert os.access(binary, os.X_OK), f"daemon binary not executable: {binary}"
        print(f"Bundled data-daemon binary: {binary}")
        PYEOF
