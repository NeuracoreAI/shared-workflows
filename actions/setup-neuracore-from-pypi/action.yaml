name: "Set up Neuracore (from PyPI)"
description: >
  Installs the released neuracore wheel from PyPI, optionally pinned to a
  release tag (e.g. the release-tag output of checkout-test-harness), then
  verifies the install by importing neuracore and printing its version.
  Used by production-style integration tests. Python must already be set up
  by the caller (actions/setup-python).

inputs:
  version:
    description: "Version to install, e.g. 'v1.2.3' or '1.2.3' (a leading 'v' is stripped). Empty installs the latest release."
    required: false
    default: ""
  extras:
    description: "Comma-separated pip extras, e.g. 'dev,ml,examples'"
    required: false
    default: ""
  pytorch-cpu:
    description: "Add the PyTorch CPU wheel index (used with the 'import' extra on CI runners)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # The daemon shells out to the system ffmpeg for video encoding and
    # hard-fails at startup without it. Linux uses a pinned static build
    # from GitHub releases because apt has hung for hours when the
    # runners' azure.archive.ubuntu.com mirror is down.
    - name: Install FFmpeg
      shell: bash
      env:
        FFMPEG_RELEASE_TAG: autobuild-2026-08-18-15-03
        FFMPEG_ARCHIVE: ffmpeg-n8.1.2-44-g7c533d0f86-linux64-gpl-8.1.tar.xz
        FFMPEG_SHA256: 03ccc8a1cb534b97c2bc43f322ddb1b7c23bd325abb7e4c31aa37f4b4c0e648f
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install ffmpeg
          ffmpeg_bin="$(command -v ffmpeg)"
        else
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-connrefused --max-time 300 -O \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE_TAG}/${FFMPEG_ARCHIVE}"
          echo "${FFMPEG_SHA256}  ${FFMPEG_ARCHIVE}" | sha256sum -c -
          tar -xf "$FFMPEG_ARCHIVE"
          echo "$RUNNER_TEMP/${FFMPEG_ARCHIVE%.tar.xz}/bin" >> "$GITHUB_PATH"
          ffmpeg_bin="$RUNNER_TEMP/${FFMPEG_ARCHIVE%.tar.xz}/bin/ffmpeg"
        fi
        # The daemon requires an ffmpeg built with libx264.
        "$ffmpeg_bin" -version | grep -q enable-libx264

    - name: Install neuracore from PyPI
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        EXTRAS: ${{ inputs.extras }}
        PYTORCH_CPU: ${{ inputs.pytorch-cpu }}
      run: |
        python -m pip install --no-cache-dir --upgrade pip
        spec="neuracore"
        if [ -n "$EXTRAS" ]; then
          spec="neuracore[$EXTRAS]"
        fi
        if [ -n "$VERSION" ]; then
          spec="$spec==${VERSION#v}"
        fi
        if [ "$PYTORCH_CPU" = "true" ]; then
          pip install --no-cache-dir "$spec" --extra-index-url https://download.pytorch.org/whl/cpu
        else
          pip install --no-cache-dir "$spec"
        fi

    - name: Verify installed neuracore
      shell: bash
      run: |
        python - << 'EOF'
        import neuracore

        print(f"Installed neuracore version: {neuracore.__version__}")
        EOF
